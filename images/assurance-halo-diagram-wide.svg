<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 722"><title>How qualifications can disappear as information moves upward</title><rect width="2048" height="722" fill="white"/>
<text x="65" y="90" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#222">How qualifications can disappear as information moves upward</text>
<text x="805" y="194" font-family="Arial, Helvetica, sans-serif" font-size="33" text-anchor="middle" fill="#222">Checks may work from what the AI selected</text><path d="M446 252 V217 H1165 V252" stroke="#2865EC" stroke-width="5" fill="none"/>
<rect x="65" y="274" width="334" height="158" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="232" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222"><tspan x="232" dy="0">Source</tspan><tspan x="232" dy="50">documents</tspan></text><text x="232" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#606060"><tspan x="232" dy="0">Annex, table or</tspan><tspan x="232" dy="46">amendment may</tspan><tspan x="232" dy="46">never be retrieved</tspan></text>
<rect x="447" y="274" width="334" height="158" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="614" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222"><tspan x="614" dy="0">AI analysis</tspan><tspan x="614" dy="50">and summary</tspan></text><text x="614" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#606060"><tspan x="614" dy="0">Selection limits and</tspan><tspan x="614" dy="46">misinterpretations</tspan><tspan x="614" dy="46">may go undetected</tspan></text>
<rect x="830" y="274" width="334" height="158" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="997" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222"><tspan x="997" dy="0">Checks and</tspan><tspan x="997" dy="50">reviewer</tspan></text><text x="997" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#606060"><tspan x="997" dy="0">Often examine what</tspan><tspan x="997" dy="46">was selected, not</tspan><tspan x="997" dy="46">what was left out</tspan></text>
<rect x="1213" y="274" width="334" height="158" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="1380" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222"><tspan x="1380" dy="0">Business</tspan><tspan x="1380" dy="50">report</tspan></text><text x="1380" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#606060"><tspan x="1380" dy="0">Review quality can</tspan><tspan x="1380" dy="46">vary by person,</tspan><tspan x="1380" dy="46">region and tenure</tspan></text>
<rect x="1596" y="274" width="334" height="158" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="1763" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#222"><tspan x="1763" dy="0">Enterprise</tspan><tspan x="1763" dy="50">summary</tspan></text><text x="1763" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" fill="#606060"><tspan x="1763" dy="0">A completion rate</tspan><tspan x="1763" dy="46">may obscure</tspan><tspan x="1763" dy="46">exceptions and</tspan><tspan x="1763" dy="46">who reviewed</tspan></text>
<path d="M400 353 H443" stroke="#B4B2A8" stroke-width="4"/><polygon points="444,353 427,344 427,362" fill="#B4B2A8"/><path d="M782 353 H825" stroke="#B4B2A8" stroke-width="4"/><polygon points="826,353 809,344 809,362" fill="#B4B2A8"/><path d="M1166 353 H1209" stroke="#B4B2A8" stroke-width="4"/><polygon points="1210,353 1193,344 1193,362" fill="#B4B2A8"/><path d="M1549 353 H1592" stroke="#B4B2A8" stroke-width="4"/><polygon points="1593,353 1576,344 1576,362" fill="#B4B2A8"/></svg>