<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1690"><title>How qualifications can disappear as information moves upward</title><rect width="1200" height="1690" fill="white"/>
<text x="65" y="85" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#222"><tspan x="65">How qualifications can disappear</tspan><tspan x="65" dy="63">as information moves upward</tspan></text>
<rect x="171" y="221" width="950" height="212" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="210" y="285" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#222" font-weight="700">Source documents</text><text x="210" y="343" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#606060"><tspan x="210" dy="0">Annex, table or amendment may never be</tspan><tspan x="210" dy="44">retrieved.</tspan></text><path d="M646 433 V494" stroke="#B4B2A8" stroke-width="5"/><polygon points="646,495 631,474 661,474" fill="#B4B2A8"/><rect x="171" y="506" width="950" height="212" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="210" y="570" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#222" font-weight="700">AI analysis and summary</text><text x="210" y="628" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#606060"><tspan x="210" dy="0">Selection limits and</tspan><tspan x="210" dy="44">misinterpretations may go undetected.</tspan></text><path d="M646 718 V779" stroke="#B4B2A8" stroke-width="5"/><polygon points="646,780 631,759 661,759" fill="#B4B2A8"/><rect x="171" y="791" width="950" height="212" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="210" y="855" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#222" font-weight="700">Checks and reviewer</text><text x="210" y="913" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#606060"><tspan x="210" dy="0">Often examine what was selected, not</tspan><tspan x="210" dy="44">what was left out.</tspan></text><path d="M646 1003 V1064" stroke="#B4B2A8" stroke-width="5"/><polygon points="646,1065 631,1044 661,1044" fill="#B4B2A8"/><rect x="171" y="1076" width="950" height="212" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="210" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#222" font-weight="700">Business report</text><text x="210" y="1198" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#606060"><tspan x="210" dy="0">Review quality can vary by person,</tspan><tspan x="210" dy="44">region and tenure.</tspan></text><path d="M646 1288 V1349" stroke="#B4B2A8" stroke-width="5"/><polygon points="646,1350 631,1329 661,1329" fill="#B4B2A8"/><rect x="171" y="1361" width="950" height="212" rx="22" fill="white" stroke="#B4B2A8" stroke-width="3"/><text x="210" y="1425" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#222" font-weight="700">Enterprise summary</text><text x="210" y="1483" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#606060"><tspan x="210" dy="0">A completion rate may obscure</tspan><tspan x="210" dy="44">exceptions and who reviewed.</tspan></text>
<path d="M145 506 H104 V1000 H145" stroke="#2865EC" stroke-width="7" fill="none"/>
<text x="76" y="1000" transform="rotate(-90 76 1000)" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#222">Checks may work from what the AI selected</text></svg>